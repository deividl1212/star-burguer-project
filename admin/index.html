
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Burguer — Painel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img class="login-logo" src="/logo.png" alt="Star Burguer" style="width:80px; height:80px; margin:0 auto 6px; display:block; object-fit:contain;">
    <h1>Star Burguer</h1>
    <p class="subtitle">Painel administrativo</p>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="loginUsuario" placeholder="usuário" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginSenha" placeholder="••••••••">
    </div>
    <p class="error-msg" id="loginError"></p>
    <button class="btn-primary" id="btnLogin">Entrar</button>
    <a class="back-link" href="/">← Voltar para o site</a>
  </div>
</div>

<!-- ===== DASHBOARD (visível só após login) ===== -->
<div class="dashboard hidden" id="dashboard">
  <header class="admin-header">
    <div class="admin-brand"><img src="/logo.png" alt="Star Burguer" style="width:26px; height:26px; object-fit:contain;"> <span>Star Burguer — Admin</span></div>
    <div class="admin-header-actions">
      <a class="link-ghost" href="/" target="_blank">Ver site</a>
      <button class="btn-ghost-sm" id="btnLogout">Sair</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-tabs">
      <button class="admin-tab active" id="tabKits">Kits</button>
      <button class="admin-tab" id="tabCupons">Cupons</button>
      <button class="admin-tab" id="tabPromocoes">Promoção</button>
      <button class="admin-tab" id="tabAdicionais">Adicionais</button>
    </div>

    <div id="kitsSection">
      <div class="admin-toolbar">
        <h2>Kits cadastrados</h2>
        <button class="btn-primary btn-sm" id="btnNovoKit">+ Novo kit</button>
      </div>
      <p class="admin-msg" id="adminMsg"></p>
      <div id="kitsList" class="kits-list"></div>
    </div>

    <div id="cupomsSection" class="hidden">
      <div class="admin-toolbar">
        <h2>Cupons de desconto</h2>
        <button class="btn-primary btn-sm" id="btnNovoCupom">+ Novo cupom</button>
      </div>
      <p class="admin-msg" id="cupomMsgAdmin"></p>
      <div id="cupomsList" class="kits-list"></div>
    </div>

    <div id="promocoesSection" class="hidden">
      <div class="admin-toolbar">
        <h2>Promoção (brinde)</h2>
        <button class="btn-primary btn-sm" id="btnNovaPromocao">+ Nova promoção</button>
      </div>
      <p class="admin-msg" id="promocaoMsgAdmin"></p>
      <div id="promocoesList" class="kits-list"></div>
    </div>

    <div id="adicionaisSection" class="hidden">
      <div class="admin-toolbar">
        <h2>Adicionais (kits 6 e 10)</h2>
        <button class="btn-primary btn-sm" id="btnNovoAdicional">+ Novo adicional</button>
      </div>
      <p class="admin-msg" id="adicionalMsgAdmin"></p>
      <div class="admin-toolbar" style="margin-top:8px; margin-bottom:10px;">
        <h3 style="font-size:0.95rem; color:var(--gold);">Kits de 6</h3>
      </div>
      <div id="adicionais6List" class="kits-list"></div>
      <div class="admin-toolbar" style="margin-top:20px; margin-bottom:10px;">
        <h3 style="font-size:0.95rem; color:var(--gold);">Kits de 10</h3>
      </div>
      <div id="adicionais10List" class="kits-list"></div>
    </div>
  </main>
</div>

<!-- ===== FORMULÁRIO DE EDIÇÃO (modal) ===== -->
<div class="overlay" id="formOverlay">
  <div class="form-card" id="formCard"></div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
